# Build and test on every push and pull request; on pushes to main, version tags (v*), and manual
# runs, also produce a Developer ID signed, notarized, and stapled disk image. Tags publish it as a
# GitHub Release. Signing needs five repository secrets (see RELEASING.md); no GitHub App is used.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    # Xcode 27 / Swift 6.4 on Apple silicon (GitHub's xcode-27 image, public preview): the
    # toolchain this package is developed with. Switch to macos-27 when that image is GA.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build/checkouts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Unit tests, then the HTTP smoke of both Core ML golden fixtures (BidirLM and Jina) against
      # the debug and release binaries. The fixtures run real Core ML with no-op functions.
      - name: Test
        run: make test PYTHON=python3

  release:
    name: Sign and notarize
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' && secrets.DEVELOPER_ID_CERT_PASSWORD != '' && secrets.NOTARY_API_KEY_P8_BASE64 != '' && secrets.NOTARY_API_KEY_ID != '' && secrets.NOTARY_API_ISSUER_ID != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check signing secrets
        run: |
          if [[ "$SIGNING_CONFIGURED" != "true" ]]; then
            msg="Signing secrets are not configured; see RELEASING.md."
            if [[ "$IS_TAG" == "true" ]]; then echo "::error::$msg"; exit 1; fi
            echo "::notice::$msg Skipping the signed build."
          fi

      - uses: actions/checkout@v6
        if: env.SIGNING_CONFIGURED == 'true'
        with:
          fetch-depth: 0

      - name: Tag matches BuildInfo.version
        if: env.SIGNING_CONFIGURED == 'true' && env.IS_TAG == 'true'
        run: |
          built="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/gloss-server/Runtime.swift)"
          if [[ "v$built" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match BuildInfo.version $built (Sources/gloss-server/Runtime.swift)."
            exit 1
          fi

      - name: Import the Developer ID certificate
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: /{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "::error::The certificate is not a Developer ID Application identity with its private key."
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Write the notary API key
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          version="$(git describe --tags --always)"
          [[ "$IS_TAG" == "true" ]] && version="$GITHUB_REF_NAME"
          Scripts/package_release.sh --version "$version" --identity "$CODESIGN_IDENTITY" --notarize --output dist

      - name: Upload the disk image
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: gloss-server-macos-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: env.SIGNING_CONFIGURED == 'true' && env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "gloss-server $GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
